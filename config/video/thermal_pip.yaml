# Video render config: describes *what* the output videos contain.
hud:
  enabled: true
  odom_topic: /odometry/filtered_odom     # meter-frame odom for speed + minimap
  pedal_topic: /racepak/pedal_pos         # throttle/brake bars (needs .throttle/.brake)
  map_tif: src/core/mission_manager/gps_maps/gascola.tif  # GeoTIFF minimap background (or null)
  map_source: auto                        # auto | tif | track | osm
  allow_network_tiles: false              # allow network map tiles when map_source: osm
  workers: null                           # overlay render workers (null = auto)

pip:
  - main: sensors/multisense_left_rect_color
    inset: sensors/thermal_left_processed
    scale: 0.25            # inset width as a fraction of the main width
    pos: bottom-right      # bottom-right | bottom-left | bottom-center | top-right | top-left
    margin: 16             # pixels from the edges
    border: 3              # border thickness in px (0 = none)
    border_color: white    # ffmpeg color name
