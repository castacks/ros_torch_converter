---
# Flat, self-contained KITTI extraction config for the FAI crl_rzr ROS1 bags
# (front MultiSense + FLIR ADK). No !include / $TARTANDRIVER_HOME so plain load_yaml works.
#
# Run with ros2bag_2_kitti.py --ros1 --rectify. Thermal/RGB (CompressedImage) are rectified
# via their camera_info; openni depth (DepthImage) is already rectified in the left frame and
# is left untouched. TF (/tf,/tf_static) is auto-extracted by TfManager (no topic entry).
#
# Sync grid: dt=0.1s (= RGB/depth ~10Hz native rate) gives tight RGB<->thermal pairing;
# thermal (~2Hz) is held forward up to interp_tol. The alignment step re-matches the nearest
# RGB/depth to each unique thermal stamp using the per-topic timestamps, so duplication of the
# slow thermal stream across grid points is harmless.

dt: 0.1
interp_tol: 0.6           # >= thermal inter-frame gap (~0.5s) so thermal is held across the grid
backward_interpolation: false

topics:
  # ---- Thermal (FLIR ADK) ----
  - name: thermal
    group: flir_adk
    topic: /crl_rzr/flir_adk/image_raw/compressed
    type: Thermal16bitCompressedImage   # 16-bit-preserving + rectified (mono16 png)
    max_age: 1.
    args: {}
  - name: thermal_info
    group: flir_adk
    topic: /crl_rzr/flir_adk/camera_info
    type: CameraInfo
    max_age: 1.
    args: {}

  # ---- RGB front (MultiSense aux color) ----
  - name: rgb_front
    group: multisense_front
    topic: /crl_rzr/multisense_front/aux/image_color/compressed
    type: CompressedImage
    max_age: 1.
    args: {}
  - name: rgb_front_info
    group: multisense_front
    topic: /crl_rzr/multisense_front/aux/image_color/camera_info
    type: CameraInfo
    max_age: 1.
    args: {}

  # ---- Stereo depth front (OpenNI, mono16 mm, left frame) ----
  - name: depth_front
    group: multisense_front
    topic: /crl_rzr/multisense_front/openni_depth/compressed
    type: DepthImage
    max_age: 1.
    args: {}
  - name: depth_front_info
    group: multisense_front
    topic: /crl_rzr/multisense_front/depth/camera_info
    type: CameraInfo
    max_age: 1.
    args: {}

  # ---- Odometry (full high-rate trajectory via INTERP storage) ----
  - name: odometry
    group: liopard
    topic: /crl_rzr/liopard/odometry
    type: OdomRBState
    max_age: 1.
    args:
      interpolation:
        type: UNCHANGED
  - name: fused_odometry
    group: liopard
    topic: /crl_rzr/liopard/fused/odometry
    type: OdomRBState
    max_age: 1.
    args:
      interpolation:
        type: UNCHANGED
