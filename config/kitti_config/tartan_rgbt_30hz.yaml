---
  # 30 Hz extraction (cameras run at ~30 Hz). Mirror of tartan_rgbt.yaml (10 Hz) with a
  # tighter dt/interp_tol. Use tartan_rgbt.yaml for the 10 Hz release.
  dt: 0.0333333

  #TIGHT tolerance: half a 30 Hz frame period (~16.7 ms). The RGB/thermal sensors run ~30 Hz
  #but are NOT hardware-synchronized, so requiring all modalities within 16.7 ms drops the
  #frames that don't align tightly (~60% of candidates are kept). This is intentional: we
  #prefer tightly-synced frames over frame count. Uses nearest-in-time matching (below) rather
  #than backward-only, since backward-only can be up to a full period (33 ms) stale and would
  #keep 0 frames at this tolerance.
  interp_tol: 0.0167

  #nearest-in-time matching (past OR future) to keep alignment within +/- interp_tol
  backward_interpolation: true

  backward_interpolation_only: false

  #overrride tfs with values from config (STRONGLY RECOMMEND USING)
  calib_file: /home/tartandriver/tartan_rgbt_ws/src/extract/static_tf_publisher/config/tartan_rgbt/handheld.yaml
  master_topic: /zed/zed_node/left/image_rect_color

  #full-rate (unsynced) topics: extracted at native rate, one folder per entry.
  #data.txt columns: wx wy wz ax ay az ; orientation.txt columns: qx qy qz qw
  full_rate_topics:
    - name: zed_imu_raw
      topic: /zed/zed_node/imu/data_raw
      type: Imu

  topics:
    - name : zed_left_rect
      topic: /zed/zed_node/left/image_rect_color
      type: Image
      max_age: 1.
      args: {}

    - name : zed_right_rect
      topic: /zed/zed_node/right/image_rect_color
      type: Image
      max_age: 1.
      args: {}

    - name: thermal_right_rect_16
      topic: /thermal_right/image_rect
      type: Thermal16bitImage
      max_age: 1.
      args: {}


    - name: thermal_left_rect_16
      topic: /thermal_left/image_rect
      type: Thermal16bitImage
      max_age: 1.
      args: {}

    - name: thermal_left_ffc
      topic: /thermal_left/ffc_status
      type: Bool
      max_age: 1.
      args: {}

    - name: thermal_right_ffc
      topic: /thermal_right/ffc_status
      type: Bool
      max_age: 1.
      args: {}

    - name: thermal_left_rect_8
      topic: /thermal_left/image_processed
      type: Image
      max_age: 1.
      args: {}

    - name: thermal_right_rect_8
      topic: /thermal_right/image_processed
      type: Image
      max_age: 1.
      args: {}
